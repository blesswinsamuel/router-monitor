version: 3

tasks:
  buf-generate:
    cmds:
      - buf generate

  go-generate:
    sources:
      - internal/lanpilot/ebpf-collector.c
      - Dockerfile.generate
    generates:
      - internal/lanpilot/ebpfcollector_x86_bpfel.go
      - internal/lanpilot/ebpfcollector_x86_bpfel.o
    cmds:
      - docker build . -f Dockerfile.generate -t blesswinsamuel/lanpilot:generate
      - docker create blesswinsamuel/lanpilot:generate > /tmp/container_id
      - defer: rm /tmp/container_id
      - defer: docker rm -f $(cat /tmp/container_id)
      - docker cp $(cat /tmp/container_id):/generated/. ./internal/lanpilot/

  web-install:
    cmds:
      - cd web && bun install

  web-build:
    cmds:
      - cd web && bun run build
      - mkdir -p internal/web/dist
      - cp -r web/dist/* internal/web/dist/

  web-dev:
    cmds:
      - cd web && bun run dev

  go-build:
    deps:
      - go-generate
      - web-build
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o lanpilot ./cmd/lanpilot

  build:
    deps:
      - go-generate
      - web-build
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o lanpilot-dev ./cmd/lanpilot

  deploy:
    deps:
      - deploy-dev

  deploy-dev:
    deps:
      - build
    cmds:
      - ssh root@router "systemctl stop lanpilot-dev 2>/dev/null || true"
      - scp lanpilot-dev root@router:/root/lanpilot-dev
      - ssh root@router "systemd-run --unit=lanpilot-dev --setenv=PORT=9156 --setenv=HOST=0.0.0.0 --setenv=DB_PATH=/var/lib/lanpilot/lanpilot-dev.db --property=AmbientCapabilities='CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON' /root/lanpilot-dev lan"
      - sleep 1
      - ssh root@router "systemctl is-active lanpilot-dev"

  logs:
    deps:
      - logs-dev

  logs-dev:
    cmds:
      - ssh root@router "journalctl -u lanpilot-dev -f"

  stop:
    deps:
      - stop-dev

  stop-dev:
    cmds:
      - ssh root@router "systemctl stop lanpilot-dev"

  status:
    deps:
      - status-dev

  status-dev:
    cmds:
      - ssh root@router "systemctl status lanpilot-dev"

  copy-to-router:
    cmds:
      - ssh root@router "pkill -f lanpilot" || true
      - scp lanpilot root@router:/root/lanpilot
      - ssh root@router "nix-shell -p autoPatchelfHook --run 'autoPatchelf /root/lanpilot'"

version: 3

tasks:
  buf-generate:
    cmds:
      - buf generate

  docker-build-generate:
    cmds:
      - docker build . -f Dockerfile.generate -t blesswinsamuel/router-monitor:generate

  go-generate:
    cmds:
      - docker create blesswinsamuel/router-monitor:generate > /tmp/container_id
      - defer: rm /tmp/container_id
      - defer: docker rm -f $(cat /tmp/container_id)
      - docker cp $(cat /tmp/container_id):/generated/ ./
      - defer: rm -rf ./generated
      - cp -r generated/* ./internal/routermonitor/
    deps:
      - docker-build-generate

  web-install:
    cmds:
      - cd web && bun install

  web-build:
    cmds:
      - cd web && bun run build
      - mkdir -p internal/web/dist
      - cp -r web/dist/* internal/web/dist/

  web-dev:
    cmds:
      - cd web && bun run dev

  go-build:
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o router-monitor ./cmd/router-monitor

  build:
    deps:
      - web-build
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o router-monitor-dev ./cmd/router-monitor

  deploy-dev:
    deps:
      - build
    cmds:
      - ssh root@router "systemctl stop router-monitor-dev 2>/dev/null || true"
      - scp router-monitor-dev root@router:/root/router-monitor-dev
      - ssh root@router "systemd-run --unit=router-monitor-dev --setenv=PORT=9156 --setenv=HOST=0.0.0.0 --setenv=DB_PATH=/var/lib/router-monitor/router-monitor-dev.db --property=AmbientCapabilities='CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON' /root/router-monitor-dev lan"
      - sleep 1
      - ssh root@router "systemctl is-active router-monitor-dev"

  deploy:
    deps:
      - deploy-dev

  logs:
    deps:
      - logs-dev

  stop:
    deps:
      - stop-dev

  logs-dev:
    cmds:
      - ssh root@router "journalctl -u router-monitor-dev -f"

  stop-dev:
    cmds:
      - ssh root@router "systemctl stop router-monitor-dev"

  status-dev:
    cmds:
      - ssh root@router "systemctl status router-monitor-dev"

  copy-to-router:
    cmds:
      - ssh root@router "pkill -f router-monitor" || true
      - scp router-monitor root@router:/root/router-monitor
      - ssh root@router "nix-shell -p autoPatchelfHook --run 'autoPatchelf /root/router-monitor'"

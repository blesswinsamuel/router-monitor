name: Docker

on:
  push:
    branches:
      - main

    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate eBPF bindings
        run: |
          docker build . -f Dockerfile.generate -t blesswinsamuel/lanpilot:generate
          docker create blesswinsamuel/lanpilot:generate > /tmp/container_id
          docker cp $(cat /tmp/container_id):/generated/ ./generated
          cp -r generated/* ./internal/lanpilot/
          rm -rf ./generated
          docker rm -f $(cat /tmp/container_id)
      - name: Go quality checks
        run: |
          go vet ./...
          GOARCH=amd64 go test ./...
          GOOS=linux GOARCH=amd64 go build -o /tmp/lanpilot ./cmd/lanpilot
      # - name: Install LLVM and Clang
      #   uses: KyleMayes/install-llvm-action@v2
      #   with:
      #     version: "17"
      #     # arch: "x64"
      #     arch: "arm64"
      # - name: Setup Go
      #   uses: actions/setup-go@v5
      # - name: Build
      #   run: |
      #     go generate ./...
      #     GOOS=linux GOARCH=arm64 go build -o lanpilot ./cmd/lanpilot

      # - name: Create release tarball
      #   if: ${{ startsWith(github.ref, 'refs/tags/') }}
      #   run: |
      #     chmod +x lanpilot
      #     tar czf lanpilot-aarch64-linux.tar.gz lanpilot

      # - name: Create github release
      #   id: create_release
      #   uses: ncipollo/release-action@v1
      #   if: ${{ startsWith(github.ref, 'refs/tags/') }}
      #   with:
      #     artifacts: lanpilot-aarch64-linux.tar.gz

      - uses: blesswinsamuel/github-actions/docker-build-and-push@main
        with:
          checkout: false
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          docker-build-platforms: linux/amd64

      - name: Create release tarball
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker create --platform linux/amd64 ghcr.io/${{ github.repository }} > /tmp/container_id
          docker cp $(cat /tmp/container_id):/bin/lanpilot ./lanpilot
          chmod +x lanpilot
          tar czf lanpilot-amd64-linux.tar.gz lanpilot

      - name: Create github release
        id: create_release
        uses: ncipollo/release-action@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          artifacts: lanpilot-amd64-linux.tar.gz

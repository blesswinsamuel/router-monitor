# Local development for router-monitor.
#
# Usage (from repo root):
#
#   devyard up          # foreground; Ctrl-C stops
#   devyard up -d       # detached
#   devyard logs -f
#   devyard down
#
# Tasks:
#   devyard run generate
#   devyard run deploy
#   devyard run logs
#   devyard run stop
#   devyard run test

version: "1"
name: router-monitor

services:
  web:
    command: bun run dev
    working_dir: ./web
    build:
      command: bun install
      working_dir: ./web
    restart: always

tasks:
  generate: task go-generate
  deploy: task deploy-dev
  logs: task logs-dev
  stop: task stop-dev
  test: go test ./...

syntax = "proto3";

package routermonitor.v1;

option go_package = "github.com/blesswinsamuel/router-monitor/gen/go/routermonitor/v1;routermonitorv1";

service RouterMonitorService {
  // Get overview status, summary counters, and current bandwidth rates.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);

  // List discovered ARP devices with cached hostnames and per-device traffic stats.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Get current traffic flows classified by IP, protocol, and direction.
  rpc GetTrafficFlows(GetTrafficFlowsRequest) returns (GetTrafficFlowsResponse);

  // Get internet connectivity targets, status, and latency diagnostics.
  rpc GetInternetHealth(GetInternetHealthRequest) returns (GetInternetHealthResponse);

  // Server-streaming RPC emitting periodic snapshots for real-time live graphs.
  rpc StreamLiveStats(StreamLiveStatsRequest) returns (stream LiveStatsResponse);

  // Query historical time series from the embedded SQLite TSDB with server-side downsampling.
  rpc QueryTimeSeries(QueryTimeSeriesRequest) returns (QueryTimeSeriesResponse);
}

message GetOverviewRequest {}

message GetOverviewResponse {
  string interface_name = 1;
  string lan_subnet_cidr = 2;
  bool internet_is_up = 3;
  double internet_latency_seconds = 4;
  int32 connected_devices_count = 5;

  uint64 total_download_bytes = 6;
  uint64 total_upload_bytes = 7;
  uint64 total_download_packets = 8;
  uint64 total_upload_packets = 9;

  double current_download_bytes_per_sec = 10;
  double current_upload_bytes_per_sec = 11;
  double current_download_packets_per_sec = 12;
  double current_upload_packets_per_sec = 13;

  uint64 total_wan_download_bytes = 14;
  uint64 total_wan_upload_bytes = 15;
  uint64 total_lan_download_bytes = 16;
  uint64 total_lan_upload_bytes = 17;

  double current_wan_download_bytes_per_sec = 18;
  double current_wan_upload_bytes_per_sec = 19;
  double current_lan_download_bytes_per_sec = 20;
  double current_lan_upload_bytes_per_sec = 21;
}

message ListDevicesRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
}

message ArpInfo {
  int64 flags = 1; // ARP flags: e.g. 2 for dynamic/complete, 6 for static
  bool is_valid = 2;
  string interface = 3;
}

message NetworkRates {
  double download_bytes_per_sec = 1;
  double upload_bytes_per_sec = 2;
  double download_packets_per_sec = 3;
  double upload_packets_per_sec = 4;

  double wan_download_bytes_per_sec = 5;
  double wan_upload_bytes_per_sec = 6;
  double wan_download_packets_per_sec = 7;
  double wan_upload_packets_per_sec = 8;

  double lan_download_bytes_per_sec = 9;
  double lan_upload_bytes_per_sec = 10;
  double lan_download_packets_per_sec = 11;
  double lan_upload_packets_per_sec = 12;
}

message NetworkUsage {
  uint64 download_bytes = 1;
  uint64 upload_bytes = 2;
  uint64 download_packets = 3;
  uint64 upload_packets = 4;

  uint64 wan_download_bytes = 5;
  uint64 wan_upload_bytes = 6;
  uint64 wan_download_packets = 7;
  uint64 wan_upload_packets = 8;

  uint64 lan_download_bytes = 9;
  uint64 lan_upload_bytes = 10;
  uint64 lan_download_packets = 11;
  uint64 lan_upload_packets = 12;
}

message Device {
  string ip_addr = 1;
  string mac_addr = 2;
  string hostname = 3;
  string interface = 4;
  string status = 5; // "active", "static", "unreachable", "offline"
  int64 first_seen_unix = 6;
  int64 last_seen_unix = 7;

  ArpInfo arp = 8;

  NetworkRates current_rates = 9;
  NetworkUsage period_usage = 10;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message GetTrafficFlowsRequest {
  int32 limit = 1;
}

message TrafficFlow {
  string direction = 1; // "ingress" or "egress"
  string eth_proto = 2; // "IPv4", "IPv6", etc.
  string ip_proto = 3;  // "TCP", "UDP", "ICMP", etc.
  string src_ip = 4;
  string dst_ip = 5;
  uint64 packets = 6;
  uint64 bytes = 7;
}

message ProtocolStats {
  string protocol = 1;
  uint64 bytes = 2;
  uint64 packets = 3;
}

message GetTrafficFlowsResponse {
  repeated TrafficFlow flows = 1;
  repeated ProtocolStats protocols = 2;
  uint64 total_bytes = 3;
  uint64 total_packets = 4;
}

message GetInternetHealthRequest {}

message PingTargetStatus {
  string addr = 1;
  bool is_up = 2;
  double last_latency_seconds = 3;
  double avg_latency_seconds = 4;
}

message GetInternetHealthResponse {
  bool overall_is_up = 1;
  repeated PingTargetStatus targets = 2;
}

message StreamLiveStatsRequest {
  int32 interval_seconds = 1; // Default: 1 second
}

message LiveStatsResponse {
  int64 timestamp_unix = 1;
  double download_bytes_per_sec = 2;
  double upload_bytes_per_sec = 3;
  double download_packets_per_sec = 4;
  double upload_packets_per_sec = 5;
  bool internet_is_up = 6;
  double internet_latency_seconds = 7;
  int32 connected_devices_count = 8;

  double wan_download_bytes_per_sec = 9;
  double wan_upload_bytes_per_sec = 10;
  double lan_download_bytes_per_sec = 11;
  double lan_upload_bytes_per_sec = 12;
}

message QueryTimeSeriesRequest {
  string metric_name = 1;               // e.g. "traffic_bytes_rate", "internet_latency_seconds"
  map<string, string> match_labels = 2; // e.g. {"direction": "ingress"}
  int64 from_unix = 3;
  int64 to_unix = 4;
  int32 step_seconds = 5;               // downsampling bucket (e.g. 5, 60, 300)
}

message TimeSeriesPoint {
  int64 timestamp_unix = 1;
  double value = 2;
  double min_value = 3;
  double max_value = 4;
}

message TimeSeries {
  string metric_name = 1;
  map<string, string> labels = 2;
  repeated TimeSeriesPoint points = 3;
}

message QueryTimeSeriesResponse {
  repeated TimeSeries series = 1;
}

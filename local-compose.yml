# Local development for router-monitor.
#
# Usage (from repo root):
#
#   local-compose up          # foreground; Ctrl-C stops
#   local-compose up -d       # detached
#   local-compose logs -f
#   local-compose down
#
# Actions:
#   local-compose run deploy
#   local-compose run logs
#   local-compose run stop
#   local-compose run test

version: "1"
name: router-monitor

services:
  web:
    command: bun run dev
    working_dir: ./web
    build:
      command: bun install
      working_dir: ./web
    restart: always

actions:
  deploy: task deploy-dev
  logs: task logs-dev
  stop: task stop-dev
  test: go test ./...

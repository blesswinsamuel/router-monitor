# Local development for router-monitor.
#
# Usage (from repo root):
#
#   local-compose up          # foreground; Ctrl-C stops
#   local-compose up -d       # detached
#   local-compose logs -f
#   local-compose down
#
# Actions:
#   local-compose run deploy-dev
#   local-compose run logs-dev
#   local-compose run stop-dev
#   local-compose run buf-generate
#   local-compose run test

version: "1"
name: router-monitor

services:
  web:
    command: bun run dev
    working_dir: ./web
    build:
      command: bun install
      working_dir: ./web
    restart: always

  dashboard:
    command: bun run dev
    working_dir: ./dashboard
    build:
      command: bun install
      working_dir: ./dashboard
    restart: always

actions:
  deploy-dev: task deploy-dev
  logs-dev: task logs-dev
  stop-dev: task stop-dev
  status-dev: task status-dev
  buf-generate: task buf-generate
  go-generate: task go-generate
  go-build: task go-build
  test: go test ./...
